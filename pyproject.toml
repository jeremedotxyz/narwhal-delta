[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "narwhal-delta"
version = "0.1.0"
description = "Traceable, uncertainty-aware underwater survey differencing"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jereme Abernathy"}]
keywords = ["lidar", "bathymetry", "change-detection", "survey", "narwhal"]
classifiers = ["Development Status :: 3 - Alpha", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering :: GIS"]

[project.scripts]
narwhal-delta = "narwhal_delta.cli:main"

[project.urls]
Repository = "https://github.com/jeremedotxyz/narwhal-delta"
Documentation = "https://github.com/jeremedotxyz/narwhal-delta/tree/main/docs"
Issues = "https://github.com/jeremedotxyz/narwhal-delta/issues"

[tool.setuptools.package-data]
narwhal_delta = ["web/*"]

name: Survey verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    name: Python ${{ matrix.python }} / scientific checks
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install application
        run: python -m pip install .
      - name: Numerical, import, archive and loopback HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce synthetic reference experiments
        run: python examples/reproduce.py
      - name: Verify browser JavaScript syntax
        run: node --check src/narwhal_delta/web/app.js
      - name: Preserve reproducibility evidence
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-evidence-python-${{ matrix.python }}
          path: runs/
          retention-days: 14
